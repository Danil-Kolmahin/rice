- name: Load zram module at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/zram.conf
    content: zram
    owner: root
    group: root
    mode: '0644'
  become: true

# TODO: check if instant apply correct and needed
# - name: Load zram kernel module immediately
#   community.general.modprobe:
#     name: zram
#     state: present
#   become: true

- name: Create udev rule for zram0 (RAM / 2)
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/99-zram.rules
    content: |
      ACTION=="add", KERNEL=="zram0", ATTR{initstate}=="0", ATTR{comp_algorithm}="zstd", ATTR{disksize}="{{ (ansible_facts['memtotal_mb'] / 2) | int }}M", TAG+="systemd"
    owner: root
    group: root
    mode: '0644'
  # notify: Reload udev rules
  become: true

- name: Add zram0 to /etc/fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/dev/zram0 none swap defaults,discard,pri=100,x-systemd.makefs 0 0"
    state: present
  # notify: Reload systemd units
  become: true

